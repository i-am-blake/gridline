<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gridline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Share+Tech+Mono&display=swap">
<style>
:root{
  --void:#02040a;
  --cyan:#29f3ff;
  --orange:#ff7a1a;
  --white:#e8fdff;
  --dim:#4b7a85;
  --panel:rgba(4,14,22,.82);
  --display:"Orbitron", "Eurostile", "Arial Black", sans-serif;
  --mono:"Share Tech Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--white);font-family:var(--mono);overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.hud h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(18px,4.6vw,28px);letter-spacing:.28em;color:var(--cyan);
  text-shadow:0 0 6px var(--cyan),0 0 22px rgba(41,243,255,.6)}
.score{margin-top:8px;font-family:var(--display);font-weight:800;font-size:clamp(20px,4.4vw,30px);color:var(--orange);letter-spacing:.06em;
  text-shadow:0 0 12px rgba(255,122,26,.55);font-variant-numeric:tabular-nums}
.score span{display:block;margin-top:4px;font-family:var(--mono);font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--white);text-shadow:none}
.over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.over .card{pointer-events:auto;text-align:center;background:var(--panel);border:1px solid rgba(255,122,26,.6);box-shadow:0 0 30px rgba(255,122,26,.25);
  padding:24px 28px;max-width:320px;width:100%;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.over h2{margin:0 0 6px;font-family:var(--display);font-weight:800;letter-spacing:.2em;color:var(--orange);font-size:22px}
.over p{margin:4px 0;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.over p b{color:var(--white);font-weight:400;font-size:20px;font-family:var(--display);letter-spacing:.06em}
.over button{margin-top:14px;border-color:var(--orange);color:var(--orange)}
.meters{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:right;line-height:1.7;font-variant-numeric:tabular-nums}
.meters b{color:var(--white);font-weight:400}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid rgba(41,243,255,.35);box-shadow:0 -1px 18px rgba(41,243,255,.18);
  display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transition:opacity .4s}
.bar.hide{opacity:0;pointer-events:none}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
button,.file{font:13px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--white);background:transparent;
  border:1px solid rgba(41,243,255,.35);border-radius:2px;padding:10px 12px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;position:relative}
button:hover,.file:hover{border-color:var(--cyan)}
button:focus-visible,.file:focus-within,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button.go{border-color:var(--orange);color:var(--orange);box-shadow:0 0 12px rgba(255,122,26,.35) inset}
button.on,button[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 10px rgba(41,243,255,.45),0 0 10px rgba(41,243,255,.25) inset}
.file input{position:absolute;width:1px;height:1px;opacity:0}
input[type=range]{accent-color:var(--cyan);width:110px}
.status{font-size:12px;color:var(--dim);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.steer{position:fixed;left:0;right:0;bottom:calc(var(--barH,0px) + 14px);display:flex;justify-content:space-between;pointer-events:none;transition:bottom .3s;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.steer button{pointer-events:auto;width:72px;height:72px;border-radius:50%;justify-content:center;font-size:24px;background:rgba(4,14,22,.55);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.steer button.held{border-color:var(--orange);color:var(--orange);box-shadow:0 0 14px rgba(255,122,26,.5)}
@media (hover:hover) and (pointer:fine){.steer{display:none}}
.keys{display:none}
@media (hover:hover) and (pointer:fine){.keys{display:inline}}
.vu{display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-top:6px}
.vu i{display:block;width:96px;height:4px;background:rgba(41,243,255,.12);position:relative;overflow:hidden}
.vu em{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--cyan)}
.vu i:nth-child(2) em{background:var(--orange)}
.vu i:nth-child(3) em{background:var(--white)}
.intro{position:fixed;left:0;right:0;top:40%;text-align:center;font-size:13px;line-height:1.8;color:var(--dim);pointer-events:none;padding:0 20px}
.intro strong{color:var(--orange);font-weight:400}
@media (max-width:560px){.status{flex-basis:100%;text-align:left}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Sound-reactive visualization"></canvas>

<div class="hud">
  <div><h1>GRIDLINE</h1><div class="score" id="scoreBox" hidden><b id="sc">0</b><span id="cb">Ride over ramps to score</span></div></div>
  <div class="meters">bass <b id="mB">0.00</b> · mid <b id="mM">0.00</b> · high <b id="mH">0.00</b><br>peak <b id="mHz">— Hz</b> · <b id="mBpm">—</b> bpm<span class="keys"><br>← → steer</span>
    <div class="vu" aria-hidden="true"><i><em id="vB"></em></i><i><em id="vM"></em></i><i><em id="vH"></em></i></div></div>
</div>
<div class="intro" id="intro">Tap <strong>Mic</strong> to react to the room<br>or play the demo beat.</div>
<div class="over" id="over" hidden><div class="card"><h2>RUN OVER</h2><p>Score <b id="oScore">0</b></p><p>Best <b id="oBest">0</b></p><button id="again" type="button">Ride again</button></div></div>

<div class="steer" id="steer">
  <button id="sl" type="button" aria-label="Steer left">◀</button>
  <button id="sr" type="button" aria-label="Steer right">▶</button>
</div>

<div class="bar" id="bar">
  <div class="grp">
    <button id="mic" class="go" type="button">● Mic</button>
    <button id="demo" type="button">▶ Demo</button>
  </div>
  <div class="grp" role="group" aria-label="Mode">
    <span class="lbl">Mode</span>
    <button type="button" data-game="auto" aria-pressed="true">Auto</button>
    <button type="button" data-game="compete" aria-pressed="false">Compete</button>
  </div>
  <div class="grp">
    <button id="fs" type="button" title="Fullscreen">⛶</button>
  </div>
  <span class="status" id="status">Idle · tap the screen to hide controls</span>
</div>


<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const CY = [41,243,255], OR = [255,122,26], WH = [232,253,255];
  const rgba = (c,a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let ac, analyser, master, monitor, freq = new Uint8Array(1024), wave = new Uint8Array(2048);
  let source = 'idle', micStream = null, micNode = null;
  let gainK = 1, agcPeak = .3, demoTimer = null, wakeLock = null;
  const setStatus = s => $('status').textContent = s;

  function ensureAudio(){
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    analyser = ac.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.75;
    master = ac.createGain();            // things we want to HEAR (demo, file)
    monitor = ac.createGain(); monitor.gain.value = 0.85;
    master.connect(analyser); master.connect(monitor); monitor.connect(ac.destination);
  }
  async function keepAwake(){ try { wakeLock = await navigator.wakeLock?.request('screen'); } catch(e){} }

  function stopAll(){
    clearInterval(demoTimer); demoTimer = null;
    if (micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (micNode){ micNode.disconnect(); micNode = null; }
    ['mic','demo'].forEach(id => $(id).classList.remove('on'));
    $('demo').textContent = '▶ Demo'; $('mic').textContent = '● Mic';
    source = 'idle';
  }

  /* ---------- Microphone ---------- */
  $('mic').addEventListener('click', async () => {
    if (source === 'mic'){ stopAll(); setStatus('Mic off'); return; }
    ensureAudio(); await ac.resume(); stopAll();
    if (!navigator.mediaDevices?.getUserMedia){ setStatus('This browser has no mic access. Open the file over https or localhost, or in Chrome/Safari.'); return; }
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
      micNode = ac.createMediaStreamSource(micStream);
      micNode.connect(analyser);           // analyse only, never play back (no feedback)
      source = 'mic'; $('mic').classList.add('on'); $('mic').textContent = '■ Mic';
      $('intro').hidden = true; setStatus('Listening to the room'); keepAwake();
    } catch(e){
      setStatus(e.name === 'NotAllowedError' ? 'Mic permission was blocked. Allow it in your browser settings and tap Mic again.' : 'Could not open the mic: ' + e.message);
    }
  });

  /* ---------- Demo beat (synth, 124 BPM) ---------- */
  const BPM = 124, step = 60/BPM/4, mtof = m => 440*Math.pow(2,(m-69)/12);
  const bassLine = [36,36,48,36, 39,39,51,39, 34,34,46,34, 41,41,43,46];
  const arp = [72,75,79,84,79,75];
  let nextT = 0, idx = 0, noise;
  function mkNoise(){ const b = ac.createBuffer(1, ac.sampleRate*.3, ac.sampleRate), d = b.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
  function env(node, t, peak, dur){ const g = ac.createGain(); g.gain.setValueAtTime(peak,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); node.connect(g); g.connect(master); return g; }
  function kick(t){ const o = ac.createOscillator(); o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(40,t+.13); env(o,t,1,.42); o.start(t); o.stop(t+.45); }
  function hat(t,open){ const s = ac.createBufferSource(); s.buffer = noise; const f = ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=8000; s.connect(f); env(f,t,open?.16:.1,open?.2:.04); s.start(t); s.stop(t+.25); }
  function clap(t){ const s = ac.createBufferSource(); s.buffer = noise; const f = ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1500; s.connect(f); env(f,t,.4,.22); s.start(t); s.stop(t+.25); }
  function bass(t,m){ const o = ac.createOscillator(), f = ac.createBiquadFilter(); o.type='sawtooth'; o.frequency.value = mtof(m);
    f.type='lowpass'; f.Q.value=8; f.frequency.setValueAtTime(1800,t); f.frequency.exponentialRampToValueAtTime(160,t+.16); o.connect(f); env(f,t,.3,step*1.7); o.start(t); o.stop(t+step*2); }
  function lead(t,m){ const o = ac.createOscillator(); o.type='square'; o.frequency.value = mtof(m); const f = ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=3200; o.connect(f); env(f,t,.05,step*1.5); o.start(t); o.stop(t+step*1.6); }
  function schedule(){
    while (nextT < ac.currentTime + .3){
      const s = idx % 16, bar = Math.floor(idx/16) % 4;
      if (s % 4 === 0) kick(nextT);
      if (s === 4 || s === 12) clap(nextT);
      if (s % 2 === 1) hat(nextT, s === 7 || s === 15);
      bass(nextT, bassLine[(Math.floor(s/4) + bar*4) % 16] + (s%4===2 ? 12 : 0));
      if (bar >= 2) lead(nextT, arp[idx % arp.length] + (bar === 3 ? 3 : 0));
      nextT += step; idx++;
    }
  }
  $('demo').addEventListener('click', () => {
    if (source === 'demo'){ stopAll(); setStatus('Demo stopped'); return; }
    ensureAudio(); ac.resume(); stopAll(); noise = noise || mkNoise();
    nextT = ac.currentTime + .05; idx = 0; demoTimer = setInterval(schedule, 25);
    source = 'demo'; $('demo').classList.add('on'); $('demo').textContent = '■ Demo';
    $('intro').hidden = true; setStatus('Demo beat · 124 BPM'); keepAwake();
  });

  /* ---------- Controls ---------- */
  document.querySelectorAll('[data-game]').forEach(b => b.addEventListener('click', () => setGame(b.dataset.game)));
  $('again').addEventListener('click', () => startRun());
  $('fs').addEventListener('click', () => { const d = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen?.(); else (d.requestFullscreen || d.webkitRequestFullscreen)?.call(d)?.catch?.(()=>{}); });
  let barPx = 0;
  const syncBar = () => { barPx = $('bar').classList.contains('hide') ? 0 : $('bar').offsetHeight; document.documentElement.style.setProperty('--barH', barPx + 'px'); };
  const toggleBar = () => { $('bar').classList.toggle('hide'); syncBar(); };
  addEventListener('resize', syncBar); syncBar();
  cv.addEventListener('click', toggleBar);

  /* Steering: arrow keys / A-D on desktop, hold the on-screen arrows on touch screens */
  let keyL = false, keyR = false, steerBtn = 0;
  const hold = (el, dir) => {
    const on = e => { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch(_){} steerBtn = dir; el.classList.add('held'); };
    const off = () => { if (steerBtn === dir) steerBtn = 0; el.classList.remove('held'); };
    el.addEventListener('pointerdown', on);
    ['pointerup','pointercancel','lostpointercapture'].forEach(ev => el.addEventListener(ev, off));
    el.addEventListener('contextmenu', e => e.preventDefault());
  };
  hold($('sl'), -1); hold($('sr'), 1);
  document.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keyL = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keyR = false;
  });
  addEventListener('blur', () => { keyL = keyR = false; steerBtn = 0; });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a'){ keyL = true; e.preventDefault(); }
    if (e.key === 'ArrowRight' || e.key === 'd'){ keyR = true; e.preventDefault(); }
    if (e.key === 'h') toggleBar();
    if (e.key === '1') setGame('auto');
    if (e.key === '2') setGame('compete');
    if (e.key === 'Enter' && over) startRun();
  });

  /* ---------- Analysis ---------- */
  const sm = { b:0, m:0, h:0 }; let pulse = 0, prevB = 0, avgB = 0, beats = [], bpm = 0;
  const band = (lo,hi) => { let s=0; for (let i=lo;i<hi;i++) s+=freq[i]; return s/((hi-lo)*255); };
  function idleData(t){
    for (let i=0;i<1024;i++){ const fall = Math.max(0,1-i/380); freq[i] = 255*fall*(.3+.22*Math.sin(t*1.4+i*.08)+.12*Math.sin(t*.6+i*.29))*.2; }
    for (let i=0;i<2048;i++) wave[i] = 128 + 12*Math.sin(i*.014+t*2.2)*Math.sin(t*.5+i*.002);
  }
  let hudT = 0, lastA = 0;
  function analyse(t){
    const adt = Math.min(.1, t - lastA || .016); lastA = t;
    if (source !== 'idle' && analyser){ analyser.getByteFrequencyData(freq); analyser.getByteTimeDomainData(wave); } else idleData(t);
    // soft-compress so loud music never pins at 1.0 and the sky keeps some range
    // automatic gain: quiet mic input is lifted toward the same range as a loud track
    const lvl = band(1,240);
    agcPeak = Math.max(lvl, agcPeak*Math.exp(-adt*.35), .025);
    gainK = Math.max(1, Math.min(10, .32/agcPeak));
    const comp = x => 1 - Math.exp(-x*1.8), rb = band(1,6);
    const b = comp(band(1,9)*gainK), m = comp(band(9,90)*gainK*1.3), h = comp(band(90,420)*gainK*2.2);
    sm.b += (b-sm.b)*.4; sm.m += (m-sm.m)*.25; sm.h += (h-sm.h)*.25;
    // beat = kick energy jumping above its own recent average
    avgB += (rb - avgB)*.03;
    if (rb > avgB*1.25 + .006 && rb > .02 && rb > prevB && (!beats.length || t - beats[beats.length-1] > .28)){
      pulse = 1; beats.push(t); if (beats.length > 12) beats.shift();
      if (beats.length > 4){ const iv = []; for (let i=1;i<beats.length;i++) iv.push(beats[i]-beats[i-1]); iv.sort((a,b)=>a-b);
        let v = 60/iv[iv.length>>1]; while (v < 80) v *= 2; while (v > 180) v /= 2; bpm = Math.round(v); }
      onBeat();
    }
    prevB = rb; pulse *= .88;
    let pk = 0, pi = 0; for (let i=2;i<600;i++) if (freq[i] > pk){ pk = freq[i]; pi = i; }
    if (t - hudT > .12){ hudT = t;
    $('vB').style.width = (sm.b*100).toFixed(0)+'%'; $('vM').style.width = (sm.m*100).toFixed(0)+'%'; $('vH').style.width = (sm.h*100).toFixed(0)+'%';
    $('mB').textContent = sm.b.toFixed(2); $('mM').textContent = sm.m.toFixed(2); $('mH').textContent = sm.h.toFixed(2);
    $('mHz').textContent = source === 'idle' ? '— Hz' : Math.round(pi*(ac.sampleRate/2/freq.length)) + ' Hz';
    $('mBpm').textContent = source === 'idle' || !bpm ? '—' : bpm; }
  }

  /* ---------- Canvas ---------- */
  let W, H, dpr;
  function resize(){ dpr = Math.min(devicePixelRatio||1, 1.5); W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle = '#02040a'; ctx.fillRect(0,0,W,H); }
  addEventListener('resize', resize); resize();

  function glowLine(c, a, w){ ctx.strokeStyle = rgba(c,a); ctx.lineWidth = w; ctx.shadowBlur = 0; }
  function gstroke(){ const w = ctx.lineWidth, ga = ctx.globalAlpha; ctx.globalAlpha = ga*.18; ctx.lineWidth = w*4.5; ctx.stroke(); ctx.globalAlpha = ga; ctx.lineWidth = w; ctx.stroke(); }

  /* The ride — the ground rolls steadily; the sky answers the music.
     Sky values rise fast on hits and fall slowly, so beats read clearly without flicker. */
  let skyT = 0, sunSpin = 0, travel = 0, cycX = 1.5, cycV = 0, laneTarget = 1.5, laneT = 5, manualT = 0, trail = [], lean = 0, ripples = [];
  let ramps = [], nextRamp = 9, alt = 0, vy = 0, rampOn = null, airborne = false, pitch = 0, inTunnel = null, jumps = 0, popT = 0, popText = '', popCol = OR;
  let score = 0, combo = 0, boost = 0, airT = 0;
  // Auto: the rider plays itself (you can still nudge it). Compete: you steer, blocks cost lives.
  let game = 'auto', lives = 3, invuln = 0, over = false, flash = 0, best = 0;
  try { best = +localStorage.getItem('gridline-best') || 0; } catch(_){}
  const RD = [255,64,96];
  function setGame(g){
    game = g; document.querySelectorAll('[data-game]').forEach(x => x.setAttribute('aria-pressed', x.dataset.game === g));
    $('scoreBox').hidden = g !== 'compete';
    if (g === 'compete') startRun(); else { over = false; $('over').hidden = true; }
  }
  function startRun(){
    game = 'compete'; over = false; $('over').hidden = true; $('scoreBox').hidden = false;
    score = 0; combo = 0; boost = 0; lives = 3; invuln = 1; flash = 0;
    ramps = ramps.filter(r => r.z - travel < 10); nextRamp = Math.max(nextRamp, travel + 18);   // a clear stretch to start
    showScore(); pop('GO', CY);
  }
  function gameOver(){
    over = true; best = Math.max(best, score);
    try { localStorage.setItem('gridline-best', best); } catch(_){}
    $('oScore').textContent = score.toLocaleString(); $('oBest').textContent = best.toLocaleString(); $('over').hidden = false;
  }
  const pop = (txt, col) => { popText = txt; popCol = col; popT = 1.4; };
  const showScore = () => { $('sc').textContent = score.toLocaleString();
    $('cb').textContent = '◆'.repeat(Math.max(0,lives)) + '◇'.repeat(3 - Math.max(0,lives)) + ' · ' + (combo > 1 ? 'x' + combo + ' combo' : 'no combo') + (boost > .05 ? ' · speed +' + Math.round(boost/1.2*100) + '%' : ''); };
  const RL = 1.2, RH = .45, RW = .65, BL = .5, BW = .5, BH = .6;
  const laneW = () => Math.min(Math.max(W, H*.9), W*1.2)*.14;   // phones get slightly wider lanes, but the rider stays in proportion
  const sky = { b:0, m:0, h:0, bands: new Float32Array(48) };
  const ease = (cur, v, dt) => cur + (v - cur)*Math.min(1, dt*(v > cur ? 14 : 1.8));
  let stars = [], ridge = [];
  function buildScene(){
    let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
    stars = Array.from({length: 140}, () => ({ x: rnd(), y: rnd()*.9, s: .6 + rnd()*1.4, ph: rnd()*6.28 }));
    ridge = []; for (let i=0;i<=80;i++){ const x = i/80, d = Math.abs(x-.5)*2;
      ridge.push(.02 + d*d*(.06 + .05*Math.sin(i*.9) + .03*Math.sin(i*2.7+1))); }
  }
  buildScene();

  /* Light cycle model, side profile (z forward from the rear, y up), in lane units before scaling */
  const HULL = [[0,.3],[0,.46],[.16,.6],[.5,.53],[.78,.5],[1.04,.64],[1.32,.58],[1.5,.36],[1.5,.3]];
  const WHEELS = [[.3,.28],[1.2,.28]], WR = .27, HALF = .14, S = 1.35;

  function drawGrid(dt){
    const hz = H*(H > W ? .48 : .58), vp = W/2;
    sky.b = ease(sky.b, sm.b, dt); sky.m = ease(sky.m, sm.m, dt); sky.h = ease(sky.h, sm.h, dt);
    for (let i=0;i<48;i++){ const bin = Math.floor(Math.pow(i/48,1.6)*420)+2; sky.bands[i] = ease(sky.bands[i], 1 - Math.exp(-freq[bin]/255*gainK*(1+i/24)*1.4), dt); }
    skyT += dt*(reduce ? .05 : .15 + sky.m*.3);
    const hit = pulse;   // 1 on a detected beat, decays quickly

    // sky body: brightens and warms toward the horizon with the bass, flashes on beats
    const lift = Math.min(1, sky.b*.55 + hit*.3);
    const g = ctx.createLinearGradient(0,0,0,hz);
    g.addColorStop(0, '#02040a');
    g.addColorStop(.5, `rgb(${4+lift*14|0},${10+lift*40|0},${24+lift*60|0})`);
    g.addColorStop(1, `rgb(${16+lift*150|0},${30+lift*70|0},${50+lift*50|0})`);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,hz);

    // stars sparkle with the highs
    for (const s of stars){ const tw = (.5+.5*Math.sin(skyT*4 + s.ph)) * (.15 + sky.h*2.2);
      ctx.fillStyle = rgba(WH, Math.min(.95, .12 + tw*.6)); ctx.fillRect(s.x*W, s.y*hz*.85, s.s, s.s); }

    // aurora ribbons trace the spectrum: lows in the middle, highs at the edges
    ctx.globalCompositeOperation = 'lighter';
    [[CY,.2,0],[OR,.32,2.1],[CY,.43,4.2]].forEach(([c,yk,off],j) => {
      const base = hz*yk + hz*.1, wob = u => Math.sin(u*5 + skyT*(1+j*.3) + off)*hz*.04;
      ctx.beginPath();
      for (let x=0;x<=W;x+=10){ const u = x/W, bi = Math.min(47, Math.floor(Math.abs(u-.5)*2*47));
        const y = base + wob(u) - sky.bands[bi]*hz*.26 - 6; x ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }
      for (let x=W;x>=0;x-=10) ctx.lineTo(x, base + wob(x/W) + hz*.1);
      ctx.closePath();
      const e = j===1 ? sky.m : sky.b*.6 + sky.h*.4;
      const rg = ctx.createLinearGradient(0, base - hz*.36, 0, base + hz*.1);
      rg.addColorStop(0, rgba(c,0)); rg.addColorStop(.6, rgba(c, .03 + e*.26 + hit*.1)); rg.addColorStop(1, rgba(c,0));
      ctx.fillStyle = rg; ctx.fill();
    });
    ctx.globalCompositeOperation = 'source-over';

    // sun: a striped disc wearing a spectrum crown; lows at the top, highs down toward the horizon
    const r = Math.min(W,H)*.12, hr = r*(1.8 + sky.b*1.6 + hit*.5);
    const sg = ctx.createRadialGradient(vp,hz,r*.5,vp,hz,hr);
    sg.addColorStop(0, rgba(OR, .12 + sky.b*.3 + hit*.25)); sg.addColorStop(1, rgba(OR,0));
    ctx.fillStyle = sg; ctx.fillRect(vp-hr, hz-hr, hr*2, hr);
    ctx.save(); ctx.beginPath(); ctx.arc(vp,hz,r,Math.PI,0); ctx.closePath(); ctx.clip();
    const dg = ctx.createLinearGradient(0, hz - r, 0, hz);
    dg.addColorStop(0, rgba(OR, .5 + sky.b*.3 + hit*.2)); dg.addColorStop(1, rgba(RD, .45 + sky.b*.2));
    ctx.fillStyle = dg; ctx.fillRect(vp - r, hz - r, r*2, r);
    ctx.fillStyle = '#05060f';
    for (let k=0;k<5;k++){ const y = hz - r*(.1 + k*.14) - ((skyT*.3) % 1)*r*.14; ctx.fillRect(vp - r, y, r*2, r*(.035 + (4-k)*.012)); }
    ctx.restore();
    glowLine(OR,.95,2+hit*2); ctx.beginPath(); ctx.arc(vp,hz,r,Math.PI,0); gstroke();
    sunSpin += dt*(.15 + sky.m*.9)*(reduce ? .3 : 1);
    const NB = 36, r0 = r*1.12, bw = Math.max(2, r*.05);
    const bars = c => { ctx.beginPath();
      for (const side of [-1, 1]) for (let i=0;i<NB;i++){
        if ((i % 6 === 0) !== (c === CY)) continue;
        const a = -Math.PI/2 + side*(i + .5)/NB*(Math.PI/2), v = sky.bands[Math.min(47, Math.floor(i/NB*48))];
        const len = r*(.05 + v*v*1.1 + hit*.08), ca = Math.cos(a), sa = Math.sin(a);
        ctx.moveTo(vp + ca*r0, hz + sa*r0); ctx.lineTo(vp + ca*(r0 + len), hz + sa*(r0 + len)); }
      glowLine(c, .95, bw); ctx.lineCap = 'round'; gstroke(); ctx.lineCap = 'butt'; };
    bars(OR); bars(CY);
    // a segmented ring that spins with the mids, and a bass ring that swells and flashes on beats
    glowLine(WH, .55, 1.4); ctx.beginPath();
    for (let k=0;k<16;k++){ const a0 = Math.PI + ((sunSpin + k/16*Math.PI*2) % (Math.PI*2)); if (a0 > Math.PI*2 - .05) continue;
      ctx.moveTo(vp + Math.cos(a0)*r*1.05, hz + Math.sin(a0)*r*1.05); ctx.arc(vp, hz, r*1.05, a0, Math.min(Math.PI*2, a0 + Math.PI*2/16*.6)); }
    gstroke();
    glowLine(CY, .2 + hit*.7, 1 + hit*2.5); ctx.beginPath(); ctx.arc(vp, hz, r*(1.25 + sky.b*.35 + hit*.15), Math.PI, 0); gstroke();

    // static mountain silhouette
    ctx.fillStyle = '#02040a'; ctx.beginPath(); ctx.moveTo(0,hz);
    ridge.forEach((h,i) => ctx.lineTo(i/80*W, hz - h*H)); ctx.lineTo(W,hz); ctx.closePath(); ctx.fill();
    glowLine(CY,.75,1.5); ctx.beginPath(); ridge.forEach((h,i) => i ? ctx.lineTo(i/80*W, hz - h*H) : ctx.moveTo(0, hz - h*H)); gstroke();

    // ground in true perspective; steady speed
    ctx.fillStyle = '#02040a'; ctx.fillRect(0,hz,W,H-hz);
    // floor fills the space above the control bar; lanes scale with the taller side on phones
    // one scale for width and height so the bike keeps its proportions on any screen
    const LX = laneW(), K = LX*1.45, Zmin = K / Math.max(40, H - hz);
    const P = (X,Z,h=0) => [vp + X*LX/Z, hz + K*(1-h)/Z];
    boost = Math.max(0, boost - dt*(game === 'compete' && !over ? .04 : .25));
    const spd = (reduce ? .3 : 1.2 + sky.b*.9) + boost;   // louder music and landed jumps both speed you up
    travel += dt*spd;
    const CZ = 2.5;
    const frac = travel % 1;
    ctx.lineWidth = 1.2;
    for (let n=0;n<44;n++){ const Z = n + 1 - frac, y = hz + K/Z; if (y > H+2) continue;
      ctx.strokeStyle = rgba(CY, Math.min(.9, .9/Z*(1 + sky.b*.9 + hit*1.4))); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    ctx.strokeStyle = rgba(CY, Math.min(.8, .3*(1 + sky.b*.8 + hit*1.2))); ctx.beginPath();
    for (let i=-14;i<=14;i++){ const a = P(i,44), b = P(i,Zmin); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); } ctx.stroke();
    glowLine(WH,.6+hit*.4,1.5+hit); ctx.beginPath(); ctx.moveTo(0,hz); ctx.lineTo(W,hz); gstroke();

    // beat shockwaves: a ring rolls out across the floor from under the cycle on every beat
    for (let i=ripples.length-1;i>=0;i--){
      ripples[i] += dt; const a = ripples[i]/.9; if (a >= 1){ ripples.splice(i,1); continue; }
      const r = .4 + a*3.4, cz = CZ + .9; ctx.beginPath(); let pen = false;
      for (let k=0;k<=72;k++){ const ang = k/72*Math.PI*2, Z = cz + Math.sin(ang)*r;
        if (Z < .45){ pen = false; continue; }
        const [x,y] = P(cycX + Math.cos(ang)*r, Z); pen ? ctx.lineTo(x,y) : ctx.moveTo(x,y); pen = true; }
      glowLine(CY, (1-a)*.9, 2.2); gstroke();
    }

    // the cycle holds a fixed distance ahead of the camera, so it rides toward the sun forever
    const st = Math.max(-1, Math.min(1, (keyR?1:0) - (keyL?1:0) + steerBtn));
    let want;
    const autoDrive = game === 'auto' || over;
    if (st){ manualT = 6; laneTarget = cycX; want = st*2.4; }
    else if (!autoDrive || (manualT -= dt) > 0){ laneTarget = cycX; want = 0; }
    else {
      // autopilot lines up with the next ramp when one is coming
      const cz0 = travel + CZ + 1, nr = ramps.find(r => r.kind !== 'block' && r.z > cz0 && r.z - cz0 < 10);
      if (nr) laneTarget = nr.x;
      laneT -= dt;
      if (!nr && laneT <= 0){ laneTarget = Math.max(-2.2, Math.min(2.2, cycX + (Math.random() < .5 ? -.6 : .6))); laneT = 4 + Math.random()*3; }
      want = Math.max(-2.4, Math.min(2.4, (laneTarget - cycX)*1.6));
    }
    cycV += (want - cycV)*Math.min(1, dt*5);
    cycX = Math.max(-2.6, Math.min(2.6, cycX + cycV*dt));
    lean += (Math.max(-.32, Math.min(.32, -cycV*.14)) - lean)*Math.min(1, dt*6);

    // obstacles spawn far ahead, off the centre line so the bike stays in three-quarter view:
    // ramps launch you; tunnels drop you below the grid and pop you out the far end
    while (nextRamp < travel + 44){
      const x = (Math.random() < .5 ? -1 : 1)*(1 + Math.floor(Math.random()*3)*.5);
      const roll = Math.random(), blocks = game === 'compete' && !over;
      if (roll < .28){ ramps.push({ kind:'tunnel', z: nextRamp, x, len: TL }); nextRamp += TL + 6 + Math.random()*5; }
      else if (blocks && roll < .6){
        ramps.push({ kind:'block', z: nextRamp, x, len: BL });
        if (Math.random() < .4) ramps.push({ kind:'block', z: nextRamp, x: x > 0 ? x - 1.1 : x + 1.1, len: BL });   // sometimes a pair
        nextRamp += 5 + Math.random()*5;
      }
      else { ramps.push({ kind:'ramp', z: nextRamp, x, len: RL }); nextRamp += 7 + Math.random()*6; }
    }
    const cz = travel + CZ + 1.0, scoring = game === 'compete' && !over;
    invuln = Math.max(0, invuln - dt);
    for (const r of ramps){
      if (r.kind !== 'block' || r.hit || !scoring || invuln > 0) continue;
      if (cz - .8 < r.z + BL && cz + .8 > r.z && Math.abs(cycX - r.x) < BW + .18 && alt < BH){
        r.hit = true; lives--; invuln = 1.8; flash = 1; combo = 0; boost = 0; pop('CRASH', RD); showScore();
        if (lives <= 0) gameOver();
      }
    }
    for (const r of ramps) if (r.kind === 'ramp' && !r.used && !r.missed && cz - r.z > RL){
      r.missed = true;
      if (scoring){ if (combo > 0) pop('COMBO LOST', CY); combo = 0; boost *= .5; showScore(); }
    }
    ramps = ramps.filter(r => r.z + r.len - travel > .5);
    // inside a tunnel the walls keep you in your lane
    if (inTunnel){ const lo = inTunnel.x - TW + .28, hi = inTunnel.x + TW - .28;
      if (cycX < lo || cycX > hi){ cycX = Math.max(lo, Math.min(hi, cycX)); cycV = 0; } }
    // what is under the bike right now
    let sf = { h: 0, slope: 0, obj: null };
    for (const r of ramps){
      const u = cz - r.z; if (u < 0 || u > r.len) continue;
      if (r.kind === 'ramp' && Math.abs(cycX - r.x) < RW) sf = { h: RH*u/RL, slope: RH/RL, obj: r };
      if (r.kind === 'tunnel' && Math.abs(cycX - r.x) < TW && (u < TR || inTunnel === r)) sf = { h: tunnelH(r, u), slope: u > r.len - TR ? TD/TR : u < TR ? -TD/TR : 0, obj: r };
    }
    if (!airborne){
      if (sf.obj){
        alt = sf.h; vy = spd*sf.slope; sf.obj.used = true;
        rampOn = sf.slope > 0 ? sf.obj : null;
        inTunnel = sf.obj.kind === 'tunnel' ? sf.obj : null;
      } else if (rampOn){
        const tun = rampOn.kind === 'tunnel';
        airborne = true; vy = spd*(tun ? .45 : RH/RL)*1.5 + .8; airT = 0;
        if (tun && scoring){ const tp = 150*Math.max(1, combo); score += tp; pop('TUNNEL +' + tp, CY); showScore(); }
        rampOn = null; inTunnel = null;
      } else { alt = 0; vy = 0; inTunnel = null; }
    }
    if (airborne){
      vy -= 5*dt; alt += vy*dt; airT += dt;
      if (alt <= 0){ alt = 0; vy = 0; airborne = false; jumps++; if (ripples.length < 4) ripples.push(0);
        // score: base + airtime, multiplied by the combo; every landing adds speed
        boost = Math.min(2.4, boost + .3);
        if (scoring){
          combo++;
          const pts = Math.round((100 + airT*200) * combo / 10) * 10;
          score += pts; pop('+' + pts + (combo > 1 ? '  x' + combo : ''), OR); showScore();
        } }
    }
    pitch += (Math.atan2(vy, spd*2.2) - pitch)*Math.min(1, dt*8);

    const sorted = ramps.slice().sort((a,b) => b.z - a.z);
    const under = alt < -.02;
    sorted.forEach(r => {
      if (r.kind === 'tunnel'){ drawTunnelBelow(r, P, hit); if (!(under && r === inTunnel)) drawTunnelRoof(r, P, hit); }
      else if (r.kind === 'block'){ if (r.z - travel + BL > CZ + .3) drawBlock(r, P, hit); }
      else if (r.z - travel + RL > CZ + .3) drawRamp(r, P, hit);
    });
    if (alt > -.01) drawCycle(P, CZ, hit, true);    // reflection in the glossy floor
    drawCycle(P, CZ, hit, false);
    // light wall: its height traces the loudness of the last second or so
    trail.push({ x: cycX, d: travel, b: alt, h: .07 + Math.min(1, sm.b*.6 + sm.m*.3 + sm.h*.1 + hit*.3)*.6 });
    while (trail.length > 2 && CZ - (travel - trail[0].d) < Math.min(.5, Zmin)) trail.shift();
    if (trail.length > 1){
      const zs = trail.map(p => CZ - (travel - p.d));
      ctx.beginPath();
      trail.forEach((p,i) => { const [x,y] = P(p.x, zs[i], p.b + p.h); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
      for (let i=trail.length-1;i>=0;i--){ const [x,y] = P(trail[i].x, zs[i], trail[i].b); ctx.lineTo(x,y); }
      ctx.closePath(); ctx.fillStyle = rgba(OR, .18 + sky.b*.15 + hit*.3); ctx.fill();
      glowLine(OR,1,2+hit*2.5); ctx.beginPath();
      trail.forEach((p,i) => { const [x,y] = P(p.x, zs[i], p.b + p.h); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }); gstroke();
    }
    // the glass roof of the tunnel you're in goes over the bike, so it reads as being below the grid
    if (under && inTunnel) drawTunnelRoof(inTunnel, P, hit);
    sorted.forEach(r => {
      if (r.kind === 'ramp' && r.z - travel + RL <= CZ + .3) drawRamp(r, P, hit);
      if (r.kind === 'block' && r.z - travel + BL <= CZ + .3) drawBlock(r, P, hit);
    });
    if (flash > 0){ ctx.fillStyle = rgba(RD, flash*.32); ctx.fillRect(0, 0, W, H); flash = Math.max(0, flash - dt*2.2); }
    if (popT > 0){
      popT -= dt; const [px,py] = P(cycX, CZ + 1, Math.max(alt, 0) + 1.3);
      ctx.font = `800 ${Math.round(Math.max(16, W*.022))}px Orbitron, sans-serif`; ctx.textAlign = 'center';
      ctx.fillStyle = rgba(popCol, Math.min(1, popT)); ctx.fillText(popText, px, py - (1.4 - popT)*30);
      ctx.textAlign = 'start';
    }
  }

  const TL = 8, TW = .75, TD = 1.2, TR = 1.4;
  function tunnelH(t, u){ return u < TR ? -TD*u/TR : u > t.len - TR ? -TD*(t.len - u)/TR : -TD; }
  const poly = (pts, fill) => { ctx.beginPath(); pts.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); };
  const line = pts => { ctx.beginPath(); pts.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); };

  function drawTunnelBelow(t, P, hit){
    const z0 = t.z - travel, za = Math.max(z0, .55), zb = z0 + t.len;
    if (zb <= za) return;
    const N = 28, zs = []; for (let k=0;k<=N;k++) zs.push(za + (zb-za)*k/N);
    const hAt = Z => tunnelH(t, Z - z0), xl = t.x - TW, xr = t.x + TW;
    // the opening in the floor
    poly([P(xl,za), P(xr,za), P(xr,zb), P(xl,zb)], '#010205');
    // inner wall on the far side (the one facing the camera)
    const xw = t.x > 0 ? xr : xl;
    const top = zs.map(Z => P(xw, Z, 0)), bot = zs.map(Z => P(xw, Z, hAt(Z)));
    const wg = ctx.createLinearGradient(0, top[N][1], 0, bot[N >> 1][1]);
    wg.addColorStop(0, '#0a2733'); wg.addColorStop(1, '#174a5a');
    poly(top.concat(bot.slice().reverse()), wg);
    // tunnel floor
    poly(zs.map(Z => P(xl, Z, hAt(Z))).concat(zs.slice().reverse().map(Z => P(xr, Z, hAt(Z)))), '#0b2a36');
    // light strip along the wall and rails along the floor, pulsing with the music
    glowLine(OR, .75 + hit*.25, 1.6 + hit*1.5); line(zs.map(Z => P(xw, Z, hAt(Z)*.5))); gstroke();
    glowLine(CY, .85, 1.4); line(zs.map(Z => P(xl + .06, Z, hAt(Z)))); gstroke(); line(zs.map(Z => P(xr - .06, Z, hAt(Z)))); gstroke();
    // floor ribs that line up with the grid above
    ctx.lineWidth = 1;
    for (let k = Math.ceil(za + travel); k <= zb + travel; k++){
      const Z = k - travel; ctx.strokeStyle = rgba(CY, Math.min(.5, .7/Z));
      line([P(xl, Z, hAt(Z)), P(xr, Z, hAt(Z))]); ctx.stroke();
    }
  }

  function drawTunnelRoof(t, P, hit){
    const z0 = t.z - travel, xl = t.x - TW, xr = t.x + TW;
    const ra = Math.max(z0 + TR, .55), rb = z0 + t.len - TR;
    if (rb > ra){
      // glass roof flush with the floor; the grid continues across it
      poly([P(xl,ra), P(xr,ra), P(xr,rb), P(xl,rb)], rgba(CY, .16 + hit*.08));
      ctx.lineWidth = 1.2;
      for (let k = Math.ceil(ra + travel); k <= rb + travel; k++){
        const Z = k - travel; ctx.strokeStyle = rgba(CY, Math.min(.9, .9/Z*(1 + sky.b*.9 + hit*1.4)));
        line([P(xl, Z), P(xr, Z)]); ctx.stroke();
      }
      ctx.strokeStyle = rgba(CY, .35);
      for (let X = Math.ceil(xl); X <= xr; X++){ line([P(X, ra), P(X, rb)]); ctx.stroke(); }
    }
    // portal frames where the road dips under and comes back up
    for (const Zp of [z0 + TR, z0 + t.len - TR]){
      if (Zp < .6) continue;
      glowLine(OR, .95, 2 + hit*2); line([P(xl,Zp,0), P(xl,Zp,-TD), P(xr,Zp,-TD), P(xr,Zp,0)]); gstroke();
    }
    // rim of the opening
    const za = Math.max(z0, .55), zb = z0 + t.len;
    if (zb > za){ glowLine(CY, .95, 1.8 + hit*1.5); line([P(xl,za), P(xl,zb), P(xr,zb), P(xr,za), P(xl,za)]); gstroke(); }
  }

  function drawBlock(r, P, hit){
    const z0 = r.z - travel, z1 = z0 + BL;
    if (z0 < .5) return;
    const xl = r.x - BW, xr = r.x + BW, hh = BH*(1 + hit*.08), col = r.hit ? [90,40,50] : RD;
    const fA = P(xl,z0,0), fB = P(xr,z0,0), fC = P(xr,z0,hh), fD = P(xl,z0,hh);
    const tC = P(xr,z1,hh), tD = P(xl,z1,hh), sb = r.x > 0 ? P(xl,z1,0) : P(xr,z1,0);
    const sv = r.x > 0 ? [fA, fD, tD, sb] : [fB, fC, tC, sb];
    poly(sv, '#14060b');
    poly([fD, fC, tC, tD], '#2a0c16');
    const fg = ctx.createLinearGradient(0, fD[1], 0, fA[1]); fg.addColorStop(0, '#3a0f1d'); fg.addColorStop(1, '#12040a');
    poly([fA, fB, fC, fD], fg);
    glowLine(col, .95, 1.8 + hit*1.5); line([fA, fB, fC, fD, fA]); gstroke(); line([fD, tD, tC, fC]); gstroke(); line([sv[2], sv[3]]); gstroke();
    // warning stripe across the face
    glowLine(col, .8, 1.2); line([P(xl + .08, z0, hh*.5), P(xr - .08, z0, hh*.5)]); ctx.stroke();
  }

  function drawRamp(r, P, hit){
    const z0 = r.z - travel, z1 = z0 + RL;
    if (z0 < .5) return;
    const A = P(r.x-RW, z0, 0), B = P(r.x+RW, z0, 0), C = P(r.x+RW, z1, RH), D = P(r.x-RW, z1, RH);
    const Cb = P(r.x+RW, z1, 0), Db = P(r.x-RW, z1, 0);
    const poly = (pts, fill) => { ctx.beginPath(); pts.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); };
    // the side facing the centre of the screen is the one we can see
    const sideV = r.x > 0 ? [A, D, Db] : [B, C, Cb];
    poly(sideV, '#071018');
    const g = ctx.createLinearGradient(0, A[1], 0, D[1]);
    g.addColorStop(0, '#0a1a24'); g.addColorStop(1, '#14303c');
    poly([A, B, C, D], g);
    glowLine(CY, .95, 1.8 + hit*1.5); ctx.beginPath();
    ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.lineTo(C[0],C[1]); ctx.lineTo(D[0],D[1]); ctx.closePath();
    ctx.moveTo(sideV[1][0], sideV[1][1]); ctx.lineTo(sideV[2][0], sideV[2][1]); gstroke();
    // chevrons pointing up the ramp
    glowLine(OR, .9, 1.6);
    for (const u of [.2, .5, .8]){
      const a = P(r.x - RW*.55, z0 + u*RL, RH*u), m = P(r.x, z0 + (u+.14)*RL, RH*(u+.14)), b = P(r.x + RW*.55, z0 + u*RL, RH*u);
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(m[0],m[1]); ctx.lineTo(b[0],b[1]); gstroke();
    }
  }

  function drawCycle(P, CZ, hit, mirror){
    const cl = Math.cos(lean), sl = Math.sin(lean);
    // local (x lateral, y up, z forward) -> screen, with lean around the contact line
    const cp = Math.cos(pitch), sp = Math.sin(pitch), zc = .75*S, m = mirror ? -1 : 1;
    const Q = (x,y,z) => { x*=S; y*=S; z*=S;
      const dz = z - zc, z2 = zc + dz*cp - y*sp, y2 = dz*sp + y*cp;      // pitch the nose up on ramps and in the air
      return P(cycX + x*cl - y2*sl, CZ + z2, m*(alt + x*sl + y2*cl)); };
    if (mirror) ctx.globalAlpha = .2;
    else if (invuln > 0 && Math.floor(invuln*12) % 2 === 0) ctx.globalAlpha = .3;
    const path = pts => { ctx.beginPath(); pts.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); };
    const near = cycX > 0 ? -HALF : HALF, far = -near;   // the side facing the centre of the screen is visible

    // floor glow
    if (!mirror){
      const [gx, gy] = P(cycX, CZ + 1, Math.min(alt, 0)), gr = laneW()*S*1.1/CZ / (1 + Math.max(alt, 0)*1.5);
      const fg = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
      fg.addColorStop(0, rgba(OR,(.3 + hit*.2)/(1 + Math.max(alt, 0)*2))); fg.addColorStop(1, rgba(OR,0));
      ctx.fillStyle = fg; ctx.fillRect(gx-gr, gy-gr, gr*2, gr*2);
    }

    const side = x => HULL.map(([z,y]) => Q(x,y,z));
    const wheel = (x,[cz,cy]) => { const pts = []; for (let k=0;k<=28;k++){ const a = k/28*Math.PI*2; pts.push(Q(x, cy + Math.sin(a)*WR, cz + Math.cos(a)*WR)); } return pts; };

    // far side, wheels, then top surface and near side so the outline reads as one solid body
    path(side(far)); ctx.closePath(); ctx.fillStyle = '#060a10'; ctx.fill();
    WHEELS.forEach(w => {
      path(wheel(0, w)); ctx.closePath(); ctx.fillStyle = '#04070c'; ctx.fill();
      glowLine(CY,1,3.2); gstroke();
      path(wheel(0, [w[0], w[1]]).map(([x,y],i,a) => [x + (a[0][0]-x)*0, y])); // keep path for inner ring below
      const inner = []; for (let k=0;k<=24;k++){ const a = k/24*Math.PI*2; inner.push(Q(0, w[1] + Math.sin(a)*WR*.6, w[0] + Math.cos(a)*WR*.6)); }
      path(inner); glowLine(CY,.45,1.2); ctx.stroke();
    });
    // top surface strips between the two side profiles
    for (let i=0;i<HULL.length-2;i++){ const [z1,y1] = HULL[i+1], [z2,y2] = HULL[i+2];
      path([Q(-HALF,y1,z1), Q(HALF,y1,z1), Q(HALF,y2,z2), Q(-HALF,y2,z2)]); ctx.closePath(); ctx.fillStyle = i % 2 ? '#13212b' : '#182a35'; ctx.fill(); }
    // rear face with the tail light
    path([Q(-HALF,.3,0), Q(HALF,.3,0), Q(HALF,.46,0), Q(-HALF,.46,0)]); ctx.closePath(); ctx.fillStyle = '#0a1118'; ctx.fill();
    // near side panel
    const st1 = Q(near,.62,.8), st2 = Q(near,.3,.8);
    const sg2 = ctx.createLinearGradient(st1[0], st1[1], st2[0], st2[1]);
    sg2.addColorStop(0, '#22343f'); sg2.addColorStop(.35, '#0d1820'); sg2.addColorStop(1, '#04070b');
    path(side(near)); ctx.closePath(); ctx.fillStyle = sg2; ctx.fill();
    glowLine(OR,1,2); gstroke();
    // specular highlight along the upper edge of the near panel
    glowLine(WH,.35,1); path(HULL.slice(2,-2).map(([z,y]) => Q(near,y-.03,z))); ctx.stroke();
    // racing stripe along the near side
    glowLine(OR,.8,1.2); path([[.12,.4],[.5,.43],[.9,.44],[1.3,.44]].map(([z,y]) => Q(near*1.02,y,z))); gstroke();
    // spine along the top centre
    glowLine(OR,.7,1.2); path(HULL.slice(1,-1).map(([z,y]) => Q(0,y+.005,z))); gstroke();
    if (mirror){ ctx.globalAlpha = 1; return; }
    // rider: hunched torso and helmet, low over the cowl
    path([Q(-.09,.52,.32), Q(.09,.52,.32), Q(.07,.72,.86), Q(-.07,.72,.86)]); ctx.closePath();
    ctx.fillStyle = '#0b121a'; ctx.fill(); glowLine(CY,.6,1); gstroke();
    const [hx,hy] = Q(0,.76,.92), hrad = laneW()*S*.11/(CZ+.6);
    ctx.beginPath(); ctx.arc(hx,hy,hrad,0,Math.PI*2); ctx.fillStyle = '#0b121a'; ctx.fill(); glowLine(CY,.8,1.2); gstroke();
    // tail light bar flashes on beats
    const t1 = Q(-HALF*.8,.4,-.01), t2 = Q(HALF*.8,.4,-.01);
    glowLine(hit > .3 ? WH : OR, 1, 2.5 + hit*2.5); ctx.beginPath(); ctx.moveTo(t1[0],t1[1]); ctx.lineTo(t2[0],t2[1]); gstroke();
    ctx.globalAlpha = 1;
  }

  function onBeat(){ if (ripples.length < 4) ripples.push(0); }

  let last = 0;
  function frame(ts){
    const t = ts/1000, dt = Math.min(.05, t-last || .016); last = t;
    analyse(t);
    ctx.globalCompositeOperation = 'source-over';
    drawGrid(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
